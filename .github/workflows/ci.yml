name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE_PREFIX: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/vigilo

jobs:
  # Shared with the Release workflow, so a release cannot be published against
  # a weaker set of checks than a branch push gets.
  check:
    name: Checks
    uses: ./.github/workflows/checks.yml

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: packages/api/Dockerfile
          - name: web
            dockerfile: packages/app/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Always push. The dev box verifies a deployment by pulling and
          # running the built image, not by trusting this job's green tick,
          # so branch builds have to be pullable too.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    name: Smoke test the built images
    runs-on: ubuntu-latest
    needs: images

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate a throwaway master key
        # Never a real key. This stack is torn down at the end of the job and
        # holds nothing but the seeded org settings row.
        run: echo "MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run the pushed images
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY_IMAGE_PREFIX }}
          TAG: sha-${{ github.sha }}
          BUILD_HASH: ${{ github.sha }}
        run: |
          docker compose pull api web
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/api/ready | grep -q '"status":"ready"'; then
              echo "ready"
              exit 0
            fi
            sleep 3
          done
          echo "the stack never became ready"
          docker compose logs
          exit 1

      - name: Serve the SPA
        run: curl -fsS http://localhost:8081/ | grep -q '<div id="app">'

      - name: The API refuses anonymous access to scoped data
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/participants)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

      - name: The break-glass CLI runs in the API container
        run: |
          docker compose exec -T api npm run admin -- admin:list | grep -q 'No admin accounts exist'
          docker compose exec -T api npm run admin -- audit:verify | grep -q 'Audit chain intact'

      - name: Tear down
        if: always()
        run: docker compose down -v
