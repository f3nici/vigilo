<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Care records for a disability support team." />
    <meta name="theme-color" content="#0F6E6E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <title>Vigilo</title>

    <!--
      Only the latin subset is preloaded. It covers everything on screen for
      almost every user, and preloading the other two would pull 95 KB on a
      phone in a house with one bar to cover characters most orgs never type.
      They still load on demand, from our origin.
    -->
    <link
      rel="preload"
      href="/fonts/inter-v20-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Set the theme before first paint. Overnight checks happen at 2am next
      // to a sleeping person, so a white flash is a real problem (doc 08 §3).
      (function () {
        try {
          var stored = localStorage.getItem('vigilo.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode, fall through to the media query */
        }
      })();
    </script>

    <!-- The PWA. Android reads the manifest; iOS reads the meta tags below. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />

    <!--
      iOS ignores most of the manifest. Without these three the app opens in a
      Safari tab from the home screen, with a URL bar, and with no push at all.
    -->
    <!--
      Both spellings. Chrome deprecated the apple- prefix in favour of the
      unprefixed one, and Safari only understands the prefixed one, so an
      installed app needs each of them to open without a URL bar.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vigilo" />
    <!-- Opaque and unrounded: iOS rounds it, and a pre-rounded icon is rounded twice. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />

    <!--
      Startup images, so an installed app on iOS does not show a blank white
      screen while it starts. They are dark on purpose: this gets opened at 2am
      beside somebody who is asleep, which is the same reason the script above
      sets the theme before first paint.
    -->

    <link
      rel="apple-touch-startup-image"
      href="/splash/portrait-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/landscape-1334x750.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
    />
