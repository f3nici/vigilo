server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Doc 07. Tightened further when the service worker and CSP land in Phase 5.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so these can be cached hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html and sw.js are never cached. Partforge hit the stale bundle
  # problem, and with a service worker in play it is worse.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # No API response is ever cached by the proxy.
  location /api/ {
    proxy_pass http://api:3000;
    # Attachments are capped at 20 MB (A12). nginx defaults to 1 MB and would
    # refuse a photo with a 413 the app cannot explain, so the limit is set
    # here to match the one the API enforces.
    client_max_body_size 21m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
