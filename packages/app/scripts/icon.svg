<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark from doc 08 §5: a filled circle inside a rounded arc that does not
    quite close. The arc is the repeating round and an eye, the circle is both
    a pupil and a recorded data point.

    This is the single source the icons are generated from, so the app icon and
    the in-app mark cannot drift apart. Keep it stroke-only plus the one circle:
    it has to survive being shrunk to 48px.
  -->
  <path
    d="M26 10.5A12 12 0 1 0 27.5 16"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="16" cy="16" r="5" fill="currentColor" />
</svg>
